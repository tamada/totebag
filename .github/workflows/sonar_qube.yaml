name: Sonar Qube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Pull requests from forks do not receive SONAR_TOKEN, so the scan cannot
    # run there; skip it instead of failing the contributor's checks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Setup Rust
        # The toolchain and the clippy component come from rust-toolchain.toml.
        # rustflags is cleared because the action defaults it to `-D warnings`:
        # this job only reports, and the `lint` job in build.yaml enforces.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
          rustflags: ""
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      - name: Generate the coverage report
        # The same measurement build.yaml sends to Coveralls.
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Generate the Clippy report
        # SonarQube does not run Clippy itself; it imports this JSON report.
        run: cargo clippy --workspace --all-targets --all-features --message-format=json > clippy-report.json
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=tamada_totebag
            -Dsonar.organization=tamada
            -Dsonar.sources=lib/src,cli/src
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.rust.lcov.reportPaths=coverage.lcov
            -Dsonar.rust.clippyReport.reportPaths=clippy-report.json
