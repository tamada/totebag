name: build
on:
  push:
    branches:
      - "**"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v4

      - name: Setup Rust
        # The version and the rustfmt/clippy components come from
        # rust-toolchain.toml, which this action reads.
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - windows-latest
          - macos-latest
    steps:
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Rust LLVM coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov

      - name: Checkout the project
        uses: actions/checkout@v4

      - name: Test & Build
        run: |
          cargo llvm-cov --lcov --output-path coverage.lcov
          cargo build

      - name: Send coverage to coveralls
        uses: coverallsapp/github-action@master
        if: matrix.os == 'ubuntu-latest'
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov

  # The default build must stay free of any C toolchain dependency, so that
  # cross-compilation needs nothing but a Rust target. See issue #76.
  pure-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Assert no C dependency in the default feature set
        run: |
          found=$(cargo tree -e normal,build --workspace \
            | grep -oE '(cc|pkg-config|lzma-sys|zstd-sys|bzip2-sys|unrar_sys) v[0-9.]+' \
            | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::a C dependency crept into the default build:"
            echo "$found"
            exit 1
          fi
          echo "default build is pure Rust"
