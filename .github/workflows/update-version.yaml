name: update_version

on:
  push:
    branches:
      - release/v*

jobs:
  version-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get tag
        id: vars
        run: |
          echo "GITHUB_REF: $GITHUB_REF"
          echo "tag=${GITHUB_REF##*/v}" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Update version
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # The workspace version is the single source of truth; everything else
          # is regenerated from it. Keep this list in sync with docs/README when
          # a new file starts embedding the version.
          sed -i "s/^version = \".*\"/version = \"$TAG\"/" Cargo.toml
          # the cli depends on the lib by path, which still needs an explicit
          # version for `cargo publish`
          sed -i "/path = \"..\/lib\"/s/version = \"[0-9][0-9.]*\"/version = \"$TAG\"/" cli/Cargo.toml
          sed "s/\$VERSION/$TAG/g" templates/README.md > README.md
          sed -i "s/ARG VERSION=.*/ARG VERSION=$TAG/g" Containerfile
          sed -i "s/-v[0-9][0-9.]*-orange/-v$TAG-orange/g;
                  s/Version-[0-9][0-9.]*-blue/Version-$TAG-blue/g;
                  s/Docker-[0-9][0-9.]*-blue/Docker-$TAG-blue/g;
                  s|releases/tag/v[0-9][0-9.]*|releases/tag/v$TAG|g" docs/content/_index.md
          cargo update --workspace

      - name: Initialize Git
        shell: bash
        run: |
          git config --global user.name  "GitHub Actions"
          git config --global user.email "action@github.com"
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"

      - name: Commit the changes
        run:  |
          git commit -a -m "update version to ${{ steps.vars.outputs.tag }}, ready to publish v${{ steps.vars.outputs.tag }}" || true

      - name: Push branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.vars.outputs.branch }}
