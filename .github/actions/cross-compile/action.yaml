name: cross-compile
description: >
  Cross compile the Rust project for multiple target platforms.
inputs:
  target:
    description: 'The target triple to compile for (e.g., x86_64-unknown-linux-musl)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Build (x86 Linux)
      if: inputs.target == 'x86_64-unknown-linux-musl'
      uses: addnab/docker-run-action@v3
      with:
        image: rust:alpine
        options: >
          -v ${{ github.workspace }}:/io
          -w /io
        run: |
          apk add --no-cache musl musl-dev build-base
          rustup target add ${{ inputs.target }}
          cargo build --release --target ${{ inputs.target }}

    - name: Build with cargo-zigbuild
      uses: addnab/docker-run-action@v3
      if: inputs.target != 'x86_64-unknown-linux-musl'
      with:
        # Pinned: 0.23.4 breaks linking cdylibs for Apple targets (sevenz-rust2
        # builds one), see rust-cross/cargo-zigbuild#479, fixed by #480 but not
        # released yet. Move to a release that contains #480, not to `latest`.
        image: ghcr.io/rust-cross/cargo-zigbuild:0.23.3
        options: >
          -v ${{ github.workspace }}:/io
          -w /io
        run: |
          # The toolchain comes from rust-toolchain.toml; rustup installs it
          # on the first cargo invocation, and `target add` applies to it.
          rustup target add ${{ inputs.target }}
          cargo zigbuild --release --target ${{ inputs.target }}

    - name: Check the binary
      shell: bash
      run: |
        ls -l target/${{ inputs.target }}/release/
        test -f target/${{ inputs.target }}/release/totebag
