[package]
name = "totebag-cli"
readme = "README.md"
description = "A tool for extracting/archiving files and directories in multiple formats."
categories = ["command-line-utilities", "compression", "filesystem" ]
keywords = ["archiver", "extractor", "compression", "cli" ]
version.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

# Enables the hidden `--generate-completion` flag used by `just generate-completion`.
completion = ["dep:clap_complete"]

# Forwarded to the `totebag` library; see lib/Cargo.toml for what they mean.
rar = ["totebag/rar"]
zstd-native = ["totebag/zstd-native"]

[dependencies]
totebag = { path = "../lib", version = "0.9.0", features = [ "clap" ] }
clap = { version = "4.5.51", features = [ "derive" ] }
clap-num = "1.2.0"
clap_complete = { version = "4.5.62", optional = true }
env_logger = "0.11.8"
humansize = "2.1.3"
log = "0.4.28"
